name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']   # tested version pe tag push karo (v1.51000.0 jaisa): build ke baad GitHub Release bhi ban jati hai
  workflow_dispatch:
permissions:
  contents: write  # Release banane ke liye (GitHub ka apna token, koi secret nahi)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Tag package.json ke version se match hona chahiye (sirf tag push par)"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$V" ]; then echo "ERROR: tag $GITHUB_REF_NAME hai par package.json version $V hai. Sahi tag lagao."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fixed signing key (same key every build, so the APK updates over the old one)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "ERROR: GitHub secret DEBUG_KEYSTORE_B64 nahi mila (Settings > Secrets and variables > Actions)"; exit 1; fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore "$RUNNER_TEMP/chaman-fixed.keystore"
          echo "CHAMAN_KS=$RUNNER_TEMP/chaman-fixed.keystore" >> "$GITHUB_ENV" # patch-android.js pins gradle's debug signing to this file
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "androiddebugkey\|SHA" || { echo "ERROR: keystore sahi nahi hai"; exit 1; }
      - run: npm install
      - name: Face model cache (restore)
        id: facecache
        uses: actions/cache/restore@v4
        with:
          path: native/face/assets/models
          key: face-model-w600k-mbf-v1
      - name: Face model (ArcFace, ~13 MB)
        run: bash scripts/fetch-face-model.sh
      - name: Face model cache (save)
        if: steps.facecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/face/assets/models
          key: face-model-w600k-mbf-v1
      - run: npx cap add android
      - run: node scripts/patch-android.js
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --stacktrace
      - name: Check APK signature (build FAILS if it is not the fixed key)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          EXP=$(keytool -list -keystore "$CHAMAN_KS" -storepass android | grep -i "SHA-256\|SHA256" | head -1 | sed 's/.*: //' | tr -d ': ' | tr 'A-F' 'a-f')
          ACT=$("$BT"/apksigner verify --print-certs "$APK" | grep -i "certificate SHA-256 digest" | head -1 | sed 's/.*: //' | tr -d ' ' | tr 'A-F' 'a-f')
          echo "keystore SHA-256 (expected): $EXP"
          echo "APK signer SHA-256 (actual): $ACT"
          "$BT"/aapt dump badging "$APK" | grep "^package:"
          if [ -z "$EXP" ] || [ "$EXP" != "$ACT" ]; then echo "ERROR: APK fixed key se sign nahi hui, isse install update nahi hoga"; exit 1; fi
          echo "OK: APK signed with the fixed key"
      - uses: actions/upload-artifact@v4
        with:
          name: chaman-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: "Release (sirf v* tag par) - APK GitHub Release me, app ka update detector isi ko padhta hai"
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          APK="chaman-nap-$TAG.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          NOTES="$(git log -1 --pretty=%s)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Chaman $TAG" --notes "$NOTES"
          fi
