<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chaman</title>
<style>
:root{--bg:#f2f4f1;--surface:#fff;--border:#dce2da;--text:#19211c;--muted:#65726a;--accent:#2d6f52;--on-accent:#fff;--user:#dfece4;--code:#e8ece6;--danger:#a63f35;color-scheme:light}
:root[data-theme=dark]{--bg:#0f1614;--surface:#171f1c;--border:#26312c;--text:#e4ebe6;--muted:#8a978f;--accent:#6fb08f;--on-accent:#0d1511;--user:#1f302a;--code:#0b100e;--danger:#e08c82;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:4px;padding:10px 14px;border-bottom:1px solid var(--border)}
header h1{font:600 22px/1 ui-serif,Georgia,serif;letter-spacing:.2px;flex:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{width:40px;height:40px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.ib:active{background:var(--surface)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{border-radius:14px;padding:10px 14px;overflow-wrap:anywhere;white-space:pre-wrap}
.ai{width:100%;padding:2px;background:none;border:0}
.me{width:80%;align-self:flex-end;background:var(--user)}
.by{display:block;font-size:12px;color:var(--muted);margin-top:6px;white-space:normal}
.err{color:var(--danger)}
.code{background:var(--code);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:8px 0;white-space:normal}
.cbar{display:flex;justify-content:flex-end;padding:2px 4px;border-bottom:1px solid var(--border)}
.cp{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.cp:active{background:var(--surface)}
.cp svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.code pre{margin:0;padding:10px 12px;overflow-x:auto;white-space:pre}
code{font:14px ui-monospace,Menlo,monospace}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:260px}
.empty b{display:block;font:600 28px ui-serif,Georgia,serif;color:var(--text);margin-bottom:6px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
form{display:flex;gap:8px;align-items:flex-end;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
textarea,input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;width:100%}
form textarea{resize:none;max-height:140px}
#send{width:44px;height:44px;flex:none;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
#send:disabled{opacity:.5}
#sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);z-index:5}
#sheet.open{display:flex}
#sbody{flex:1;overflow-y:auto;padding:14px 14px 30px}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.sec h2{font-size:16px;margin-bottom:8px}
.sec label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.sec textarea{min-height:64px}
.btn{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:12px;width:100%;font-weight:600}
.btn.ghost{background:none;border:1px solid var(--border);color:var(--text);margin-top:10px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
#pend{display:none;flex-wrap:wrap;gap:6px;padding:8px 14px 0;border-top:1px solid var(--border)}
#pend+input+form{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips img{max-width:110px;max-height:110px;border-radius:10px;object-fit:cover}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{color:var(--muted);display:flex;align-items:center;padding:0 2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#modal.open{display:flex}
#mcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:380px;width:100%}
#mcard h2{font:600 20px ui-serif,Georgia,serif;margin-bottom:8px}
#mcard p{color:var(--muted);font-size:14px;margin-bottom:14px}
#mcard ul{margin:0 0 14px 18px;color:var(--text);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

const PREV_SYS=`You are Chaman, the personal AI assistant of Najeef. Najeef built you and you belong to him. You are not a public chatbot.

WHERE YOU RUN
You live inside a native Android app called Chaman, on Najeef's phone (Oppo K13 Turbo Pro). He talks to you through the chat screen of that app.

const P=[
 {id:'chaman',name:'Chaman',g:1},
 {id:'groq',name:'Groq',url:'https://api.groq.com/openai/v1/chat/completions',model:'openai/gpt-oss-120b'},
 {id:'cerebras',name:'Cerebras',url:'https://api.cerebras.ai/v1/chat/completions',model:'gpt-oss-120b'},
 {id:'openrouter',name:'OpenRouter',url:'https://openrouter.ai/api/v1/chat/completions',model:'openrouter/free'},
 {id:'nvidia',name:'NVIDIA',url:'https://integrate.api.nvidia.com/v1/chat/completions',model:'openai/gpt-oss-120b'},
 {id:'mistral',name:'Mistral (optional)',url:'https://api.mistral.ai/v1/chat/completions',model:'mistral-small-latest'}];
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=Object.assign({theme:'auto',system:DEF_SYS,keys:{},models:{},ptr:{},vision:{provider:'openrouter',model:'openrouter/free'},ch:{url:'https://chamanvip-chaman.hf.space',key:'',hf:''}},ld('nap_s',{}));
if([OLD_SYS,PREV_SYS,PREV2_SYS].includes(S.system)){S.system=DEF_SYS;sv('nap_s',S)}
const OLDM={groq:'llama-3.3-70b-versatile',cerebras:'llama-3.3-70b',openrouter:'meta-llama/llama-3.3-70b-instruct:free',nvidia:'meta/llama-3.3-70b-instruct'};
Object.keys(OLDM).forEach(k=>{if(S.models&&S.models[k]===OLDM[k]){delete S.models[k];sv('nap_s',S)}});
if(S.vision&&S.vision.provider==='nvidia'&&['nvidia/nemotron-3-ultra-550b-a55b','google/gemma-3-27b-it'].includes(S.vision.model)){S.vision={provider:'openrouter',model:'openrouter/free'};sv('nap_s',S)}
let H=ld('nap_h',[]);
const cool={};let busy=false;

function theme(){const d=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);theme();

const ICO_COPY='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',ICO_OK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=t=>esc(t).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(_,c)=>'<div class="code"><div class="cbar"><button type="button" class="cp" aria-label="Copy code">'+ICO_COPY+'</button></div><pre><code>'+c+'</code></pre></div>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');

const kb=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
const att=m=>{let h='';const hi=m.imgs&&m.imgs.length;if(hi)h+='<div class="chips">'+m.imgs.map(u=>'<img src="'+u+'" alt="">').join('')+'</div>';const fs=(m.files||[]).filter(a=>!(a.kind==='img'&&hi));if(fs.length)h+='<div class="chips">'+fs.map(a=>'<span class="chip">'+esc(a.name)+' - '+kb(a.size)+'</span>').join('')+'</div>';return h};
function render(){
  const c=$('#chat');
  if(!H.length){c.innerHTML='<div class="empty"><b>Chaman</b>Kuch bhi pucho. Pehle Settings me keys daal do.</div>';return}
  c.innerHTML=H.map(m=>m.role==='user'?'<div class="msg me">'+esc(m.content||'')+att(m)+'</div>':'<div class="msg ai'+(m.err?' err':'')+'">'+fmt(m.content)+(m.by?'<span class="by">'+esc(m.by)+'</span>':'')+'</div>').join('');
  c.scrollTop=c.scrollHeight;
}
const T=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
const keysOf=id=>(S.keys[id]||'').split(/[\s,]+/).filter(Boolean);

async function callOpenAI(p,msgs,mdl){
  const ks=keysOf(p.id);if(!ks.length)return null;
  const n=ks.length,start=(S.ptr[p.id]||0)%n;let last='';
  for(let i=0;i<n;i++){
    const idx=(start+i)%n,k=ks[idx];
    if((cool[k]||0)>Date.now()){last='keys cooldown me';continue}
    try{
      const r=await T(fetch(p.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:mdl||S.models[p.id]||p.model,messages:msgs,max_tokens:1024})}),45000);
      if(!r.ok){let bd='';try{bd=(await r.text()).replace(/\s+/g,' ').slice(0,140)}catch(e){}
        cool[k]=Date.now()+(r.status===429?60000:(r.status===401||r.status===403)?600000:15000);last='HTTP '+r.status+(bd?' '+bd:'');continue}
      const j=await r.json();const t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(!t){last='empty reply';continue}
      S.ptr[p.id]=idx;sv('nap_s',S);return t;
    }catch(e){cool[k]=Date.now()+15000;last=e.message}
  }
  throw new Error(last);
}
async function callChaman(msgs){
  const c=S.ch;if(!c.url||!c.key)return null;
  const base=c.url.replace(/\/+$/,'')+'/gradio_api/call/chat';
  const h={'Content-Type':'application/json'};if(c.hf)h.Authorization='Bearer '+c.hf;
  const r1=await T(fetch(base,{method:'POST',headers:h,body:JSON.stringify({data:[JSON.stringify(msgs),c.key,400]})}),30000);
  if(!r1.ok)throw new Error('HTTP '+r1.status);
  const id=(await r1.json()).event_id;
  const r2=await T(fetch(base+'/'+id,{headers:h}),120000);
  const m=(await r2.text()).match(/event: complete\s*\ndata: (.*)/);
  if(!m)throw new Error('quota khatam ya Space so raha hai');
  const o=JSON.parse(JSON.parse(m[1])[0]);
  if(o.error)throw new Error(o.error);return o.reply;
}
function userText(m,vision,last){
  let t=m.content||'';
  (m.files||[]).forEach(a=>{
    if(a.kind==='text'&&a.body!=null)t+='\n\n[File: '+a.name+' ('+kb(a.size)+')'+(a.cut?', sirf pehla hissa':'')+']\n'+a.body;
    else if(a.kind==='text')t+='\n\n[File '+a.name+' pehle attach hui thi, ab uska content available nahi]';
    else if(a.kind==='img'){if(!(vision&&last&&m.imgs&&m.imgs.length))t+='\n\n[Image attached: '+a.name+' - tumhe ye dikhti nahi]'}
    else t+='\n\n[File attached: '+a.name+', '+kb(a.size)+'. App iska content padh nahi sakta, sirf naam aur size pata hai]';
  });
  return t.trim()||'(attachment)';
}
function apiMsgs(vision){
  const hist=H.filter(m=>!m.err).slice(-20);let li=-1;
  hist.forEach((m,i)=>{if(m.role==='user')li=i});
  return [{role:'system',content:S.system}].concat(hist.map((m,i)=>{
    if(m.role!=='user')return{role:m.role,content:m.content};
    const t=userText(m,vision,i===li);
    if(vision&&i===li&&m.imgs&&m.imgs.length)return{role:'user',content:[{type:'text',text:t}].concat(m.imgs.map(u=>({type:'image_url',image_url:{url:u}})))};
    return{role:'user',content:t};
  }));
}
async function ask(){
  const lm=H[H.length-1];
  if(lm&&lm.imgs&&lm.imgs.length){
    const vp=P.find(p=>p.id===S.vision.provider)||P.find(p=>p.id==='nvidia');

  for(const p of P){
    try{const t=p.g?await callChaman(msgs):await callOpenAI(p,msgs);if(t)return{content:t.trim(),by:p.name.replace(' (optional)','')}}
    catch(e){errs.push(p.name+': '+e.message)}
  }
  throw new Error(errs.length?'Saare providers fail:\n'+errs.join('\n'):'Koi provider set nahi hai. Settings me key daalo.');
}
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;
  const i=$('#in'),t=i.value.trim();if(!t&&!PEND.length)return;
  i.value='';i.style.height='auto';busy=true;$('#send').disabled=true;
  H.push({role:'user',content:t,files:PEND.map(a=>({name:a.name,size:a.size,kind:a.kind,body:a.body,cut:a.cut})),imgs:PEND.filter(a=>a.kind==='img').map(a=>a.img)});
  PEND=[];rendP();render();
  $('#chat').insertAdjacentHTML('beforeend','<div class="msg ai dots" id="ty"><span></span><span></span><span></span></div>');$('#chat').scrollTop=1e9;
  try{const r=await ask();H.push({role:'assistant',content:r.content,by:r.by})}
  catch(err){H.push({role:'assistant',content:err.message,err:1})}
  H=H.slice(-100);sv('nap_h',H.map(m=>m.role==='user'?Object.assign({},m,{imgs:undefined,files:(m.files||[]).map(a=>({name:a.name,size:a.size,kind:a.kind}))}):m));busy=false;$('#send').disabled=false;render();
});
$('#in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});
$('#newb').onclick=()=>{if(!H.length)return;H=[];sv('nap_h',H);render()};

function sheet(){
  const b=$('#sbody');
  const ch=S.ch;
  let h='<div class="sec"><h2>Keys import</h2><p class="hint" style="margin:0 0 10px">.json ya .txt file se keys form me bhar jayengi. Save dabane par hi set hongi.</p><button type="button" class="btn ghost" style="margin-top:0" id="imp"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>File se keys import karo</button><p class="hint" id="imsg"></p></div><div class="sec"><h2>Chaman (apna model)</h2><label>Space URL</label><input id="c_url" value="'+esc(ch.url)+'" autocapitalize="off"><label>CHAMAN_API_KEY</label><input id="c_key" value="'+esc(ch.key)+'" autocapitalize="off"><label>HF read token</label><input id="c_hf" value="'+esc(ch.hf)+'" autocapitalize="off"></div>';
  P.filter(p=>!p.g).forEach(p=>{h+='<div class="sec"><h2>'+p.name+'</h2><label>Keys (comma se alag)</label><textarea id="k_'+p.id+'" autocapitalize="off" spellcheck="false">'+esc(S.keys[p.id]||'')+'</textarea><label>Model</label><input id="m_'+p.id+'" value="'+esc(S.models[p.id]||p.model)+'" autocapitalize="off"></div>'});
  h+='<div class="sec"><h2>Vision (photo samajhne wala model)</h2><label>Provider</label><select id="v_p">'+['nvidia','openrouter','groq','mistral'].map(id=>'<option value="'+id+'">'+P.find(p=>p.id===id).name.replace(' (optional)','')+'</option>').join('')+'</select><label>Model</label><input id="v_m" value="'+esc(S.vision.model)+'" autocapitalize="off"><p class="hint">Photo bhejne par sirf yahi model jawab deta hai. Us provider ki key upar uske section me daalo.</p></div>';
  h+='<div class="sec"><h2>System prompt</h2><textarea id="sys" style="min-height:130px">'+esc(S.system)+'</textarea><button class="btn ghost" id="rs">Default prompt wapas lao</button></div>';
  h+='<div class="sec"><h2>Theme</h2><select id="th"><option value="auto">System ke hisaab se</option><option value="dark">Dark</option><option value="light">Light</option></select><p class="hint">Order: Chaman, Groq, Cerebras, OpenRouter, NVIDIA, Mistral. Key fail ho to agli key, saari fail ho to agla provider.</p></div>';
  h+='<button class="btn" id="save">Save</button>';
  b.innerHTML=h;$('#th').value=S.theme;$('#v_p').value=S.vision.provider;$('#imp').onclick=()=>{kiMode='sheet';$('#ki').click()};
  $('#rs').onclick=()=>{$('#sys').value=DEF_SYS};
  $('#save').onclick=()=>{
    S.ch={url:$('#c_url').value.trim(),key:$('#c_key').value.trim(),hf:$('#c_hf').value.trim()};
    P.filter(p=>!p.g).forEach(p=>{S.keys[p.id]=$('#k_'+p.id).value.trim();const m=$('#m_'+p.id).value.trim();S.models[p.id]=m||p.model});
    S.system=$('#sys').value.trim()||DEF_SYS;S.theme=$('#th').value;S.ptr={};S.vision={provider:$('#v_p').value,model:$('#v_m').value.trim()||'openrouter/free'};
    sv('nap_s',S);theme();$('#sheet').classList.remove('open');
  };
}
$('#setb').onclick=()=>{sheet();$('#sheet').classList.add('open')};
$('#closeb').onclick=()=>$('#sheet').classList.remove('open');
let PEND=[];
function rendP(){const d=$('#pend');d.innerHTML=PEND.map((a,i)=>'<span class="chip">'+esc(a.name)+' - '+kb(a.size)+'<button type="button" data-i="'+i+'" aria-label="Remove"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button></span>').join('');d.style.display=PEND.length?'flex':'none'}
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const M=896,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
async function readAtt(f){
  const o={name:f.name,size:f.size};
  if(f.type.startsWith('image/')&&f.type!=='image/svg+xml'){try{o.img=await shrink(f);o.kind='img';return o}catch(e){}}
  if(f.size<=2097152){
    const u=new Uint8Array(await f.arrayBuffer());let bin=false;
    for(let i=0;i<Math.min(u.length,8000);i++){if(u[i]===0){bin=true;break}}
    if(!bin){const t=new TextDecoder('utf-8').decode(u);if((t.match(/\uFFFD/g)||[]).length<=t.length*.01+2){o.kind='text';o.cut=t.length>60000;o.body=o.cut?t.slice(0,60000):t;return o}}
  }
  o.kind='bin';return o;
}
$('#att').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{const fs=Array.from(e.target.files);e.target.value='';for(const f of fs){if(PEND.length>=6)break;try{PEND.push(await readAtt(f))}catch(err){PEND.push({name:f.name,size:f.size,kind:'bin'})}}rendP()};
$('#pend').onclick=e=>{const b=e.target.closest('button');if(b){PEND.splice(+b.dataset.i,1);rendP()}};

const PROV=['groq','cerebras','openrouter','nvidia','mistral'];
let kiMode='first';
function kind(label){
  const l=(label||'').toLowerCase();
  if(/url|space|host/.test(l))return'url';
  if(/(^|[^a-z])hf([^a-z]|$)|hugging/.test(l))return'hf';
  if(l.includes('chaman'))return'chkey';
  if(l.includes('nvapi'))return'nvidia';
  for(const p of PROV)if(l.includes(p))return p;
  return'';
}
function vkind(v){
  if(/^https?:\/\//i.test(v))return'url';
  if(/^gsk_/.test(v))return'groq';
  if(/^csk-/.test(v))return'cerebras';
  if(/^sk-or-/.test(v))return'openrouter';
  if(/^nvapi-/.test(v))return'nvidia';
  if(/^hf_/.test(v))return'hf';
  return'';
}
function addKV(o,k,v){
  v=String(v).trim().replace(/^["']+|["',;]+$/g,'');
  if(!v)return;
  if(k==='url'){o.ch.url=v;return}
  if(k==='hf'){o.ch.hf=v;return}
  if(k==='chkey'){o.ch.key=v;return}
  if(PROV.includes(k)&&v.length>=8){(o.keys[k]=o.keys[k]||[]).push(v);return}
  o.skip++;
}
function feed(o,label,val){
  const lk=kind(label);
  const parts=String(val).split(/[\s,;]+/).map(x=>x.replace(/^["']+|["']+$/g,'')).filter(Boolean);
  if(lk==='url'||lk==='hf'||lk==='chkey'){addKV(o,lk,parts[0]||'');return}
  parts.forEach(p=>addKV(o,lk||vkind(p),p));
}
function walk(o,n,label){
  if(typeof n==='string'){feed(o,label,n);return}
  if(Array.isArray(n)){n.forEach(x=>walk(o,x,label));return}
  if(n&&typeof n==='object')Object.keys(n).forEach(k=>walk(o,n[k],(label?label+'_':'')+k));
}
function parseKeys(text){
  const o={keys:{},ch:{},skip:0};
  const t=String(text).replace(/^\uFEFF/,'').trim();
  try{walk(o,JSON.parse(t),'');return o}catch(e){}
  o.keys={};o.ch={};o.skip=0;
  t.split(/\r?\n/).forEach(line=>{
    line=line.trim();
    if(!line||/^(#|\/\/)/.test(line))return;
    if(/^https?:\/\//i.test(line)){feed(o,'url',line);return}
    const m=line.match(/^["']?([A-Za-z0-9_. -]+?)["']?\s*[=:]\s*(.+)$/);
    if(m)feed(o,m[1],m[2]);else feed(o,'',line);
  });
  return o;
}
function sumr(o){
  const a=[];
  PROV.forEach(id=>{const n=(o.keys[id]||[]).length;if(n)a.push(P.find(p=>p.id===id).name.replace(' (optional)','')+': '+n+(n>1?' keys':' key'))});
  if(o.ch.key)a.push('Chaman key');if(o.ch.hf)a.push('HF token');if(o.ch.url)a.push('Space URL');
  return a;
}
const mergeKeys=(old,add)=>{const set=[];(String(old||'').split(/[\s,]+/).filter(Boolean).concat(add)).forEach(k=>{if(set.indexOf(k)<0)set.push(k)});return set.join(', ')};
function applyKeys(o){
  PROV.forEach(id=>{if(o.keys[id])S.keys[id]=mergeKeys(S.keys[id],o.keys[id])});
  Object.assign(S.ch,o.ch);S.ptr={};sv('nap_s',S);
}
function modal(state,list){
  const m=$('#modal'),c=$('#mcard');m.classList.add('open');
  const up='<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>';
  if(state==='done'){
    c.innerHTML='<h2>Keys set ho gayi</h2><ul>'+list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><button class="btn" id="mdone">Done</button>';
    $('#mdone').onclick=()=>{sv('nap_first',1);m.classList.remove('open')};
    return;
  }
  c.innerHTML='<h2>Keys import karo</h2><p>'+(state==='none'?'Is file me koi key nahi mili. Dusri file chuno ya baad me Settings se daalo.':'Apni keys ki .json ya .txt file chuno. File phone se bahar nahi jaati. Ye option Settings me bhi milega.')+'</p><button class="btn" id="mpick">'+up+'File chuno</button><button class="btn ghost" id="mskip">Skip</button>';
  $('#mpick').onclick=()=>{kiMode='first';$('#ki').click()};
  $('#mskip').onclick=()=>{sv('nap_first',1);m.classList.remove('open')};
}
$('#ki').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let txt='';try{txt=await f.text()}catch(err){}
  const o=parseKeys(txt),a=sumr(o);
  if(kiMode==='sheet'){
    const msg=$('#imsg');if(!msg)return;
    if(!a.length){msg.textContent='Is file me koi key nahi mili.';return}
    PROV.forEach(id=>{const ta=$('#k_'+id);if(ta&&o.keys[id])ta.value=mergeKeys(ta.value,o.keys[id])});
    if(o.ch.url)$('#c_url').value=o.ch.url;
    if(o.ch.key)$('#c_key').value=o.ch.key;
    if(o.ch.hf)$('#c_hf').value=o.ch.hf;
    msg.textContent='Mila: '+a.join(', ')+(o.skip?' ('+o.skip+' entry samajh nahi aayi)':'')+'. Ab Save dabao.';
    return;
  }
  if(!a.length){modal('none');return}
  applyKeys(o);modal('done',a.concat(o.skip?[o.skip+' entry samajh nahi aayi']:[]));
};
const hasKeys=Object.keys(S.keys).some(k=>(S.keys[k]||'').trim())||(S.ch&&S.ch.key);
if(!hasKeys&&!ld('nap_first',0))modal('ask');

function fbCopy(t){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}
function copyTxt(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).catch(()=>fbCopy(t));
  fbCopy(t);return Promise.resolve();
}
$('#chat').addEventListener('click',e=>{
  const b=e.target.closest('.cp');if(!b)return;
  const c=b.closest('.code').querySelector('code');
  copyTxt(c.textContent).then(()=>{b.innerHTML=ICO_OK;setTimeout(()=>{b.innerHTML=ICO_COPY},1500)});
});
render();
</script>
