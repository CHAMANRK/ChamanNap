<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chaman</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Chaman</h1>
  <select id="prov" aria-label="Provider"></select>
  <button class="ib" id="newb" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="setb" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<div id="chat"></div>
<div id="pend"></div>
<input type="file" id="fi" multiple hidden>
<input type="file" id="ki" accept=".json,.txt,application/json,text/plain" hidden>
<div id="modal"><div id="mcard"></div></div>
<div id="slash"></div>
<form id="f">
  <button type="button" class="ib" id="att" aria-label="Attach file"><svg viewBox="0 0 24 24"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.4-8.4"/></svg></button>
  <textarea id="in" rows="1" placeholder="Message likho"></textarea>
  <button id="send" type="submit" aria-label="Send"><svg class="ib" style="width:22px;height:22px" viewBox="0 0 24 24"><path d="M5 12l14-7-5 14-2-6z" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
</form>
<div id="sheet">
  <header><h1>Settings</h1><button class="ib" id="closeb" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div id="sbody"></div>
</div>
<div id="viewer"><header><button class="ib" id="vback" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><h1 id="vtitle"></h1><button type="button" class="vm" id="vmode">Code</button><button class="ib" id="vsave" aria-label="Phone me save karo (Download)"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button><button class="ib" id="vcopy" aria-label="Copy file"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></header><div id="viewer-body"></div></div>
<script src="js/prompts.js"></script>
<script src="js/core.js"></script>
<script src="js/providers.js"></script>
<script src="js/chat.js"></script>
<script src="js/settings.js"></script>
<script src="js/attach.js"></script>
<script src="js/keys.js"></script>
<script src="js/helpers.js"></script>
<script src="js/phone.js"></script>
<script src="js/tools.js"></script>
<script src="js/termux.js"></script>
<script src="js/workspace.js"></script>
<script src="js/files.js"></script>
<script src="js/notes.js"></script>
<script src="js/slash.js"></script>
<script src="js/fast.js"></script>
<script src="js/rules.js"></script>
<script src="js/log.js"></script>
<script src="js/main.js"></script>
</body>
</html>
